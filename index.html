<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161616">
<title>Rimuovi sfondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@import url("https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap");
:root{color-scheme:light;--bg:#f2f1ee;--fg:#292929;--muted:#777}
@media(prefers-color-scheme:dark){:root:not(.light){color-scheme:dark;--bg:#161616;--fg:#e5e5e2;--muted:#a0a09d}}
:root.dark{color-scheme:dark;--bg:#161616;--fg:#e5e5e2;--muted:#a0a09d}
:root.light{color-scheme:light;--bg:#f2f1ee;--fg:#292929;--muted:#777}
*{box-sizing:border-box}
body{font-family:Jost,sans-serif;margin:0;padding:36px 24px;background:var(--bg);color:var(--fg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:30px;font-weight:600}
#theme{width:40px;height:21px;padding:4px;border:0;border-radius:99px;background:var(--fg);cursor:pointer;display:flex;align-items:center}
#theme:before{content:"";width:15px;height:15px;flex:0 0 15px;border-radius:50%;background:var(--bg);transition:transform .22s ease}
@media(prefers-color-scheme:dark){:root:not(.light) #theme:before{transform:translateX(16px) scale(1.03)}}
:root.dark #theme:before{transform:translateX(16px) scale(1.03)}
:root.light #theme:before{transform:translateX(0) scale(1)}
main{max-width:600px;margin:36px auto 0}
p{font-size:18px;line-height:1.8;margin:0 0 16px}
a{color:var(--fg)}
.upload{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 18px}
button.action{border:1px solid var(--fg);background:transparent;color:var(--fg);padding:7px 12px;border-radius:2px;font-size:15px}
button.action:hover{opacity:.7}
button:disabled{opacity:.35;cursor:default}
#fileInput{display:none}
#dropZone{min-height:220px;border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
#placeholder{color:var(--muted)}
#placeholder p{font-size:15px;margin:0}
#canvasWrap{display:none;width:100%;align-items:center;justify-content:center}
#resultCanvas{display:none;max-width:100%;max-height:520px;object-fit:contain;background-color:var(--bg);background-image:linear-gradient(45deg,#8882 25%,transparent 25%),linear-gradient(-45deg,#8882 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#8882 75%),linear-gradient(-45deg,transparent 75%,#8882 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin-top:22px}
.control{min-width:0}
.control label,.label{display:block;font-size:15px;margin-bottom:7px}
input[type=range]{width:100%;accent-color:var(--fg)}
input[type=color]{width:36px;height:30px;padding:2px;border:1px solid var(--muted);background:transparent}
.colorline{display:flex;align-items:center;gap:8px}
.small{font-size:14px;color:var(--muted);line-height:1.5}
.value{color:var(--muted);font-size:14px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5}
.check input{margin-top:5px;accent-color:var(--fg)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
#status{font-size:14px;color:var(--muted);margin-top:12px;min-height:20px}
@media(max-width:520px){body{padding:24px 18px}.controls{grid-template-columns:1fr;gap:16px}.upload{align-items:flex-start;flex-direction:column}#dropZone{min-height:180px}}
</style>
</head>
<body>
<header>
  <h1>Rimuovi sfondo</h1>
  <button id="theme" role="switch" aria-label="Cambia tema" aria-checked="false"></button>
</header>
<main>
  <div class="upload">
    <p style="margin:0">Rimuovi lo sfondo da un logo e scaricalo in PNG.</p>
    <button class="action" id="chooseBtn">Apri immagine</button>
  </div>
  <div id="dropZone">
    <div id="placeholder"><p>Trascina qui un'immagine oppure clicca su “Apri immagine”.</p><p>JPG, PNG o WebP</p></div>
    <div id="canvasWrap"><canvas id="resultCanvas"></canvas></div>
  </div>
  <div class="small" id="imageInfo" style="margin-top:8px"></div>
  <div class="controls">
    <div class="control">
      <label for="colorPicker">Colore da rimuovere</label>
      <div class="colorline">
        <input type="color" id="colorPicker" value="#ffffff" aria-label="Colore da rimuovere">
        <button class="action" id="sampleBtn" disabled>Contagocce</button>
        <button class="action" id="edgeBtn" disabled>Bordi</button>
      </div>
    </div>
    <div class="control">
      <label for="tolerance">Tolleranza <span class="value" id="toleranceValue">32</span></label>
      <input id="tolerance" type="range" min="0" max="150" value="32">
    </div>
    <div class="control">
      <label for="softness">Bordi <span class="value" id="softnessValue">18</span></label>
      <input id="softness" type="range" min="0" max="80" value="18">
    </div>
    <label class="check"><input type="checkbox" id="allSimilar"><span>Rimuovi lo stesso colore anche nelle aree interne.</span></label>
  </div>
  <div class="actions">
    <button class="action" id="downloadBtn" disabled>Scarica PNG</button>
    <button class="action" id="resetBtn" disabled>Ripristina</button>
    <button class="action" id="replaceBtn" hidden>Sostituisci immagine</button>
  </div>
  <div id="status">Nessuna immagine selezionata.</div>
  <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp">
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const fileInput=$('fileInput'), chooseBtn=$('chooseBtn'), replaceBtn=$('replaceBtn');
  const placeholder=$('placeholder'), canvasWrap=$('canvasWrap'), canvas=$('resultCanvas');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const colorPicker=$('colorPicker'), tolerance=$('tolerance'), softness=$('softness');
  const allSimilar=$('allSimilar'), status=$('status');
  let originalCanvas=null, originalCtx=null, originalImageData=null, loadedName='logo', sampleMode=false, busy=false;

  function setStatus(s){status.textContent=s}
  function hexToRgb(hex){return {r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)}}
  function dist(a,b){const dr=a.r-b.r,dg=a.g-b.g,db=a.b-b.b;return Math.sqrt(dr*dr+dg*dg+db*db)}
  function pixel(data,i){return {r:data[i],g:data[i+1],b:data[i+2]}}
  function updateControls(on){
    $('sampleBtn').disabled=!on; $('edgeBtn').disabled=!on;
    $('downloadBtn').disabled=!on; $('resetBtn').disabled=!on;
    replaceBtn.hidden=!on;
  }
  function loadFile(file){
    if(!file) return;
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)){setStatus('Formato non supportato. Usa JPG, PNG o WebP.');return}
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const maxPixels=24000000, scale=Math.min(1,Math.sqrt(maxPixels/(img.naturalWidth*img.naturalHeight)));
      const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
      originalCanvas=document.createElement('canvas');originalCanvas.width=w;originalCanvas.height=h;
      originalCtx=originalCanvas.getContext('2d',{willReadFrequently:true});originalCtx.drawImage(img,0,0,w,h);
      originalImageData=originalCtx.getImageData(0,0,w,h);canvas.width=w;canvas.height=h;
      loadedName=(file.name||'logo').replace(/\.[^.]+$/,'');
      $('imageInfo').textContent=`${img.naturalWidth} × ${img.naturalHeight}px`;
      placeholder.style.display='none';canvasWrap.style.display='flex';canvas.style.display='block';
      updateControls(true);setStatus('Immagine caricata. Seleziona il colore da eliminare.');
      detectEdgeColor(false);process();
    };
    img.onerror=()=>{URL.revokeObjectURL(url);setStatus('Non riesco a leggere questa immagine.')};
    img.src=url;
  }
  function detectEdgeColor(setStatusToo=true){
    if(!originalImageData)return;
    const d=originalImageData.data,w=originalCanvas.width,h=originalCanvas.height;
    // Median RGB of samples along the outer edge, robust against a few logo pixels touching it.
    const samples=[];
    const stride=Math.max(1,Math.floor(Math.max(w,h)/500));
    for(let x=0;x<w;x+=stride){samples.push(pixel(d,(x)*4),pixel(d,((h-1)*w+x)*4))}
    for(let y=0;y<h;y+=stride){samples.push(pixel(d,(y*w)*4),pixel(d,(y*w+w-1)*4))}
    const median=key=>{const a=samples.map(p=>p[key]).sort((x,y)=>x-y);return a[Math.floor(a.length/2)]};
    const rgb={r:median('r'),g:median('g'),b:median('b')};
    colorPicker.value='#'+[rgb.r,rgb.g,rgb.b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
    if(setStatusToo)setStatus('Colore stimato dai bordi. Regola la tolleranza se necessario.');
  }
  function process(){
    if(!originalImageData||busy)return;
    busy=true;
    try{
      const w=originalCanvas.width,h=originalCanvas.height,src=originalImageData.data;
      const out=new ImageData(new Uint8ClampedArray(src),w,h);
      const key=hexToRgb(colorPicker.value), tol=Number(tolerance.value), soft=Number(softness.value);
      const total=w*h, mask=new Uint8Array(total), queue=new Int32Array(total);
      let head=0,tail=0;
      const canRemove=i=>dist(pixel(src,i*4),key)<=Math.min(442,tol+soft);
      const push=i=>{if(i<0||i>=total||mask[i]||!canRemove(i))return;mask[i]=1;queue[tail++]=i};
      if(allSimilar.checked){
        for(let i=0;i<total;i++)if(canRemove(i))mask[i]=1;
      }else{
        // Region-growing only from the outermost pixels, preserving same-color details enclosed in the logo.
        for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}
        for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
        while(head<tail){
          const i=queue[head++],x=i%w;
          if(x>0)push(i-1);if(x<w-1)push(i+1);if(i>=w)push(i-w);if(i<total-w)push(i+w);
        }
      }
      // Feather the boundary using color distance: the closer a pixel is to the key color,
      // the more transparent it becomes. Only pixels connected to the background are altered.
      for(let i=0;i<total;i++){
        if(!mask[i])continue;
        const p=i*4,delta=dist(pixel(src,p),key);
        let alpha=0;
        if(soft>0){
          const start=Math.max(0,tol-soft),end=tol+soft;
          alpha=Math.round(255*Math.max(0,Math.min(1,(delta-start)/(end-start||1))));
        }
        out.data[p+3]=Math.min(out.data[p+3],alpha);
      }
      ctx.putImageData(out,0,0);
      setStatus(`Sfondo rimosso · ${w.toLocaleString('it-IT')} × ${h.toLocaleString('it-IT')} px`);
    }catch(e){console.error(e);setStatus("Errore durante l'elaborazione. Prova con un'immagine più piccola.")}
    busy=false;
  }
  function reset(){if(!originalImageData)return;ctx.putImageData(originalImageData,0,0);setStatus('Originale ripristinato.')}
  chooseBtn.addEventListener('click',()=>fileInput.click());
  replaceBtn.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',e=>{loadFile(e.target.files[0]);fileInput.value=''});
  ['dragenter','dragover'].forEach(ev=>$('dropZone').addEventListener(ev,e=>{e.preventDefault();$('dropZone').style.outline='2px solid #888'}));
  ['dragleave','drop'].forEach(ev=>$('dropZone').addEventListener(ev,e=>{e.preventDefault();$('dropZone').style.outline='none'}));
  $('dropZone').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
  $('sampleBtn').addEventListener('click',()=>{sampleMode=true;canvas.style.cursor='crosshair';setStatus('Clicca sul colore dello sfondo nell’anteprima.');});
  canvas.addEventListener('click',e=>{
    if(!sampleMode||!originalImageData)return;
    const r=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(canvas.width-1,Math.floor((e.clientX-r.left)/r.width*canvas.width))),y=Math.max(0,Math.min(canvas.height-1,Math.floor((e.clientY-r.top)/r.height*canvas.height)));
    const p=originalCtx.getImageData(x,y,1,1).data;
    colorPicker.value='#'+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
    sampleMode=false;canvas.style.cursor='default';process();
  });
  $('edgeBtn').addEventListener('click',()=>{detectEdgeColor();process()});
  colorPicker.addEventListener('input',process);
  tolerance.addEventListener('input',()=>{$('toleranceValue').textContent=tolerance.value;process()});
  softness.addEventListener('input',()=>{$('softnessValue').textContent=softness.value;process()});
  allSimilar.addEventListener('change',process);
  $('resetBtn').addEventListener('click',reset);
  $('downloadBtn').addEventListener('click',()=>{
    if(!originalImageData)return;
    canvas.toBlob(blob=>{
      if(!blob){setStatus('Esportazione non riuscita.');return}
      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=loadedName+'-trasparente.png';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
      setStatus('PNG trasparente esportato.');
    },'image/png');
  });
})();
</script>
<script>
(() => {
 const root=document.documentElement,themeButton=document.getElementById('theme');
 let savedTheme=null;try{savedTheme=sessionStorage.getItem('theme')}catch(e){}
 if(savedTheme)root.classList.add(savedTheme);
 const system=matchMedia('(prefers-color-scheme: dark)');
 function dark(){let t=null;try{t=sessionStorage.getItem('theme')}catch(e){}return t==='dark'||(t!=='light'&&system.matches)}
 function syncTheme(){themeButton.setAttribute('aria-checked',String(dark()))}
 themeButton.addEventListener('click',()=>{const next=dark()?'light':'dark';root.classList.remove('dark','light');root.classList.add(next);try{sessionStorage.setItem('theme',next)}catch(e){}syncTheme()});
 syncTheme();
})();
</script>
</body>
</html>
