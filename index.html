<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161616">
<title>Rimuovi sfondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Rimuovi sfondo</h1>
</header>
<main>
  <div class="upload">
    <p style="margin:0">Rimuovi lo sfondo da un logo e scaricalo in PNG.</p>
    <button class="action" id="chooseBtn">Apri immagine</button>
  </div>
  <div id="dropZone">
    <div id="placeholder"><p>Trascina qui un'immagine oppure clicca su “Apri immagine”.</p><p>JPG, PNG o WebP</p></div>
    <div id="canvasWrap"><canvas id="resultCanvas"></canvas></div>
  </div>
  <div class="small" id="imageInfo" style="margin-top:8px"></div>
  <div class="controls">
    <div class="control">
      <label for="colorPicker">Colore da rimuovere</label>
      <div class="colorline">
        <input type="color" id="colorPicker" value="#ffffff" aria-label="Colore da rimuovere">
        <button class="action" id="sampleBtn" disabled>Contagocce</button>
        <button class="action" id="edgeBtn" disabled>Bordi</button>
      </div>
    </div>
    <div class="control">
      <label for="tolerance">Tolleranza <span class="value" id="toleranceValue">32</span></label>
      <input id="tolerance" type="range" min="0" max="150" value="32">
    </div>
    <div class="control">
      <label for="softness">Bordi <span class="value" id="softnessValue">18</span></label>
      <input id="softness" type="range" min="0" max="80" value="18">
    </div>
    <label class="check"><input type="checkbox" id="allSimilar"><span>Rimuovi lo stesso colore anche nelle aree interne.</span></label>
  </div>
  <div class="actions">
    <button class="action" id="downloadBtn" disabled>Scarica PNG</button>
    <button class="action" id="resetBtn" disabled>Ripristina</button>
    <button class="action" id="replaceBtn" hidden>Sostituisci immagine</button>
  </div>
  <div id="status">Nessuna immagine selezionata.</div>
  <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp">
</main>
<script src="script.js" defer></script>
</body>
</html>
